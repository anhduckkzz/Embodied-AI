[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-zero-to-master"
version = "0.1.0"
description = "A from-scratch Reinforcement Learning curriculum: tabular methods to VLA-for-robotics."
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "anhduckkzz" }]
keywords = ["reinforcement-learning", "deep-rl", "ppo", "sac", "robotics", "vla", "education"]
dependencies = [
    "gymnasium>=0.29",
    "torch>=2.1",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "imageio>=2.31",
    "tqdm>=4.65",
]

[project.optional-dependencies]
box2d = ["gymnasium[box2d]>=0.29"]
extras = ["stable-baselines3>=2.2", "tensorboard>=2.15"]
sim = ["mujoco>=3.0", "gymnasium[mujoco]>=0.29"]        # Part 4 simulation
perception = ["open3d>=0.18", "opencv-python>=4.8"]      # Parts 5-7 (production)
vla = ["transformers>=4.40", "pillow", "lerobot"]        # Part 10
dev = ["pytest>=7.4"]

[project.scripts]
rl-train = "rl.train:main"

[tool.setuptools]
packages = ["rl", "rl.agents", "robotics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
